# 手动发布流水线：仅在 Actions 配额可用时由人工触发
# 双保险：仅 workflow_dispatch；仓库变量 ENABLE_GHCR_BUILD=true 才执行，否则任务 skipped
name: Manual Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如 latest / v1.0.0）'
        required: true
        default: latest
      push_latest:
        description: '同时更新 latest 标签'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/allinost/go-frontend-core

jobs:
  release:
    name: 'Build & Push GHCR'
    if: vars.ENABLE_GHCR_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # @nkui/vue 是 file:../NKUI/Vue3 本地依赖，构建时需要 NKUI 源码
      - name: Checkout NKUI
        uses: actions/checkout@v4
        with:
          repository: Allinost/NKUI
          path: nkui

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 前端镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
